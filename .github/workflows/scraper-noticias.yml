name: Scraper de noticias del día

# Corre todos los días a las 6:00 a. m. y a la 1:00 p. m. (hora de Colombia),
# cuando se cambia el scraper y cuando se lanza a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scraper-noticias.yml"

permissions:
  contents: write

concurrency:
  group: scraper-noticias
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recolectar noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper/scraper_noticias.py --horas 48

      - name: Publicar data/noticias.json
        run: |
          git config user.name "atlas-scraper[bot]"
          git config user.email "atlas-scraper@users.noreply.github.com"
          git add data/noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Noticias del día $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
